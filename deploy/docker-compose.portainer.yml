# Portainer stack — NO env_file; secrets in Portainer UI only.
# One port per service (same pattern as music/home on 192.168.1.230):
#   cultur.eqnox.pt      → http://192.168.1.230:${CULTUR_WEB_PORT}  (cultur-web)
#   api.cultur.eqnox.pt  → http://192.168.1.230:${CULTUR_API_PORT}  (cultur-api)
# No Caddy — no Host header routing.

name: cultur

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cultur}
      POSTGRES_USER: ${POSTGRES_USER:-cultur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cultur} -d ${POSTGRES_DB:-cultur}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cultur

  cultur-web:
    image: ${CULTUR_WEB_IMAGE:-ghcr.io/edequinox/cultur-web:main}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CULTUR_WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cultur

  cultur-api:
    image: ${CULTUR_API_IMAGE:-ghcr.io/edequinox/cultur-api:main}
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      SERVER_API_SECRET_KEY: ${SERVER_API_SECRET_KEY:?set SERVER_API_SECRET_KEY in Portainer}
      SERVER_API_PORT: "8787"
      SERVER_API_DATA_DIR: /app/data
      SERVER_API_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cultur}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cultur}
      TMDB_API: ${TMDB_API:-}
      TMDB_LANG: ${TMDB_LANG:-en-US}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      IGDB_LANGUAGE: ${IGDB_LANGUAGE:-en}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      BGG_MIN_REQUEST_INTERVAL_SECONDS: ${BGG_MIN_REQUEST_INTERVAL_SECONDS:-2}
      BGG_HOT_CACHE_TTL_SECONDS: ${BGG_HOT_CACHE_TTL_SECONDS:-3600}
      MUSICBRAINZ_APP_NAME: ${MUSICBRAINZ_APP_NAME:-Cultur}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      MUSICBRAINZ_MIN_REQUEST_INTERVAL_SECONDS: ${MUSICBRAINZ_MIN_REQUEST_INTERVAL_SECONDS:-1.1}
      FANART_API_KEY: ${FANART_API_KEY:-}
      FANART_CLIENT_KEY: ${FANART_CLIENT_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_HOME_TAG: ${LASTFM_HOME_TAG:-rock}
      STASH_EVENTS_CACHE_TTL_SECONDS: ${STASH_EVENTS_CACHE_TTL_SECONDS:-21600}
      STASH_EVENTS_SYNC_PAGE_SIZE: ${STASH_EVENTS_SYNC_PAGE_SIZE:-50}
      STASH_EVENTS_SYNC_MAX_PAGES: ${STASH_EVENTS_SYNC_MAX_PAGES:-5}
      BOOK_CATALOG_PRIMARY_SOURCE: ${BOOK_CATALOG_PRIMARY_SOURCE:-hardcover}
      PORBASE_ISBN_URL_TEMPLATE: ${PORBASE_ISBN_URL_TEMPLATE:-http://urn.porbase.org/isbn/dc/xml?id={isbn}}
    volumes:
      - cultur-api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CULTUR_API_PORT:-8787}:8787"
    networks:
      - cultur

networks:
  cultur:

volumes:
  postgres-data:
  cultur-api-data:
