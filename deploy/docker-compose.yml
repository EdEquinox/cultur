name: cultur

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../cultur_backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cultur}
      POSTGRES_USER: ${POSTGRES_USER:-cultur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cultur} -d ${POSTGRES_DB:-cultur}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cultur

  cultur-api:
    build:
      context: ../cultur_backend
    restart: unless-stopped
    env_file:
      - ../cultur_backend/.env
    environment:
      SERVER_API_PORT: "8787"
      SERVER_API_DATA_DIR: /app/data
      SERVER_API_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cultur}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cultur}
    volumes:
      - ../cultur_backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Local health check while DNS/TLS is not ready (not required once Caddy serves HTTPS)
      - "127.0.0.1:8787:8787"
    networks:
      - cultur
    # If MusicBrainz TLS fails in Docker, switch to network_mode: host and set
    # SERVER_API_DATABASE_URL to use 127.0.0.1:5432 — see deploy/README.md

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      CULTUR_DOMAIN: ${CULTUR_DOMAIN}
      CULTUR_API_DOMAIN: ${CULTUR_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./data/web:/srv/web:ro
      - ./releases:/srv/releases:ro
    depends_on:
      - cultur-api
    networks:
      - cultur

networks:
  cultur:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
