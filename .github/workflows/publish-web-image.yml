name: Publish web image

on:
  push:
    branches: [main]
    paths:
      - cultur_app/**
      - deploy/Dockerfile.web
      - deploy/nginx-web.conf
      - .github/workflows/publish-web-image.yml

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cultur-web:main
            ghcr.io/${{ github.repository_owner }}/cultur-web:${{ github.sha }}
          build-args: |
            CULTUR_DEFAULT_API_URL=${{ vars.CULTUR_DEFAULT_API_URL }}
            CULTUR_ANDROID_APK_URL=${{ vars.CULTUR_ANDROID_APK_URL }}
