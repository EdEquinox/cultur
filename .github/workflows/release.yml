name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('cultur_app/pubspec.lock') }}

      - name: Build web
        working-directory: cultur_app
        env:
          CULTUR_DEFAULT_API_URL: ${{ vars.CULTUR_DEFAULT_API_URL }}
          CULTUR_ANDROID_APK_URL: ${{ vars.CULTUR_ANDROID_APK_URL }}
        run: |
          flutter pub get
          args=(--release)
          if [[ -n "${CULTUR_DEFAULT_API_URL:-}" ]]; then
            args+=(--dart-define=CULTUR_DEFAULT_API_URL="${CULTUR_DEFAULT_API_URL}")
          fi
          if [[ -n "${CULTUR_ANDROID_APK_URL:-}" ]]; then
            args+=(--dart-define=CULTUR_ANDROID_APK_URL="${CULTUR_ANDROID_APK_URL}")
          fi
          flutter build web "${args[@]}"

      - name: Build Android APK
        working-directory: cultur_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Package web build
        run: |
          cd cultur_app/build/web && zip -r "$GITHUB_WORKSPACE/cultur-web.zip" .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cultur-web.zip
            cultur_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
