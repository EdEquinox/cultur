name: Publish API image

on:
  push:
    branches: [main]
    paths:
      - cultur_backend/**
      - .github/workflows/publish-api-image.yml

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR tag
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: cultur_backend
          file: cultur_backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cultur-api:main
            ghcr.io/${{ env.OWNER_LC }}/cultur-api:${{ github.sha }}
