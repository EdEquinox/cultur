name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cultur_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SERVER_API_SECRET_KEY: ci-test-secret-key-min-32-chars-long
          TMDB_API: ""
          HARDCOVER_API_TOKEN: ci-placeholder
        run: |
          pytest -q \
            --ignore=tests/test_discogs_client.py \
            --ignore=tests/test_bookmory_import_service.py \
            --ignore=tests/test_book_page_backfill.py \
            -k "not test_catalog_games_uses_igdb_source and not test_catalog_tv_home and not test_ava_backup"
